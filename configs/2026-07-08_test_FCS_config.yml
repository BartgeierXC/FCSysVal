# This file is the central place to define your simulation setup.
# It is used by the simulation runner to create the simulation environment and to run the simulation.

version: 0.3 # The version of the package this .yml file corresponds to.

# Simulation environment: Either FMU, OpenModelica or Dymola. WiP: Matlab/Simulink
simulation_environment: OpenModelica

# Model File: The filename of the package or FMU containing the model. FMUs must be located in the "fmus" directory.
model_file: VFCS/VirtualFCS/package.mo

# Name and path of the model within the Model file
model_name: VirtualFCS.ComponentTesting.TestFuelCellSystem # For fmus containing one model, can be empty
solver: dassl # solver/method, FMUs support only cvode and euler, leave empty to use the default solver

simulator_path: "" # set OPENMODELICAHOME and/or provide an explicit simulator path

pre_sim_scripts: [ ] # run scripts ahead of the simulation, load libraries, etc.
post_sim_scripts: [ ] # run scripts after the simulation, scripts are executed after the simulation results are returned and have no effect on the post-processing performed by the moo-sim-interface

# Path to a custom build directory, relative to the current working directory or absolute path.
custom_build_dir: results # None: use the simulation environment default behaviour. If empty, uses the model_name as build directory.

n_chunks: 1 # Number of chunks to divide the workload (parallel processing). Choose 1 to disable parallel processing.

sim_flags: [ -noEventEmit ] # additional simulation flags, for example '-lv=-LOG_SUCCESS' and '-noEventEmit'. Only for OpenModelica

# Simulation Setup: The parameters are used to configure the simulation environment.
simulation_setup:
#  start_time: 0.0
#  stop_time: 1000
  step_size: 1 # interval length of the simulation, choose EITHER step_size OR num_of_steps
#  num_of_steps: 0.0 # Max Samples, determines the number of results
  tolerance: 0.0001

  input_configuration:
    # list of parameter names to be modified during the simulation
    parameter_names: []
    #    parameter_names: [ T_cut ]
    # list of parameter values to be applied to the parameters defined in parameter_names OR a range: min:step:max (inclusive)
    parameter_values: [ ] # please note the list of lists syntax
    #    parameter_values: [ [ 50 ] ] # please note the list of lists syntax
    # Create a Meshgrid of the parameter_values and evaluate the model for each pairwise combination
    pairwise: False

  output_configuration:
    # list of parameter names to be returned after the simulation
    parameter_names: [ time, fuelCellSystem.fuelCellStack.U_Z, fuelCellSystem.Power_stack, fuelCellSystem.fuelCellSubSystems.subSystemAir.P_cmp, fuelCellSystem.fuelCellSubSystems.subSystemHydrogen.P_arb, fuelCellSystem.fuelCellSubSystems.subSystemCooling.pumpElectricDCFluidHF.realPowerEl.y, fuelCellSystem.fuelCellStack.relHumCaIn.phi, fuelCellSystem.fuelCellSubSystems.subSystemAir.tempHxOut.T, fuelCellSystem.fuelCellStack.temperatureCathodeIn.T, fuelCellSystem.fuelCellStack.temperatureCathodeOut.T, fuelCellSystem.fuelCellStack.temperatureCoolantIn.y, fuelCellSystem.fuelCellStack.temperatureCoolantOut.y, fuelCellSystem.fuelCellSubSystems.subSystemAir.cmp.temperature.T, fuelCellSystem.fuelCellStack.port_b_H2.p, fuelCellSystem.fuelCellStack.port_b_Air.p, fuelCellSystem.fuelCellSubSystems.subSystemAir.relativePressure.p_rel, fuelCellSystem.fuelCellStack.pipeCoolant.dp, fuelCellSystem.fuelCellStack.port_a_Air.m_flow, fuelCellSystem.fuelCellSubSystems.subSystemAir.cmp.pressureRatio.y, fuelCellSystem.fuelCellStack.port_a_Air.p, systemControl.step_no ]
#    parameter_names: [ time, fuelCellSystem.fuelCellStack.U_Z, fuelCellSystem.Power_stack, fuelCellSystem.fuelCellSubSystems.subSystemAir.P_cmp, fuelCellSystem.fuelCellSubSystems.subSystemHydrogen.P_arb, fuelCellSystem.fuelCellStack.relHumCaIn.phi, fuelCellSystem.fuelCellSubSystems.subSystemAir.tempHxOut.T, fuelCellSystem.fuelCellStack.temperatureCathodeIn.T, fuelCellSystem.fuelCellStack.temperatureCathodeOut.T, fuelCellSystem.fuelCellStack.temperatureCoolantIn.y, fuelCellSystem.fuelCellStack.temperatureCoolantOut.y, fuelCellSystem.fuelCellSubSystems.subSystemAir.cmp.temperature.T, fuelCellSystem.fuelCellStack.port_b_H2.p, fuelCellSystem.fuelCellStack.port_b_Air.p, fuelCellSystem.fuelCellSubSystems.subSystemAir.relativePressure.p_rel, fuelCellSystem.fuelCellStack.pipeCoolant.dp, fuelCellSystem.fuelCellStack.port_a_Air.m_flow, fuelCellSystem.fuelCellSubSystems.subSystemAir.cmp.pressureRatio.y, systemControl.step_no ]

    # apply functions to the simulation results, for example compute the mean a parameter over the simulation time
    # available are: take_last, 1-take_last, mean, average, median, min, max, sum, std, var or None (return all values)
    result_transformation: None # alternatively: supply a list of functions, one for each output parameter

# Post Simulation Options: The post simulation options are used to process the data after successful simulations.
post_simulation_options:
  # save the results, either as csv or txt file or None (do not save)
  save_results_options: None # csv, txt, None
  print_results: False # print the results to the console after all simulations are finished

fmu_settings: # these settings apply only when FMU is selected as simulation environment
  # Simulation type: Co-Simulation and Model Exchange are supported. If None, use the fmus default simulation type.
  simulation_type: Co-Simulation
  sync: False # synchronized execution (for debugging)
  show_progressbar: False # Show a progressbar for parallel processing
  # Print the progress of each simulation every full (s)econd, (m)inute, (h)our, (d)ay. Choose None to disable.
  print_single_simulation_progress: d

  # Save the final value of every available simulation parameter to a separate .json file
  save_all_simulation_parameters: False
  parameters_regex_filter: None # a regex statement to filter the parameters by name or None (include all parameters)
  filter_mode: include # include or exclude the parameters matched by parameters_regex_filter


experimental_mode_on: False
experimental_options:
  plot_results: False # plot the results as x-y pairs if two output parameters are defined
  plot_results_lib: plotly # choose between plotly and matplotlib
  custom_result_transformation: None # supply a custom numpy function to transform the results, example: np.quantile(x, 0.99, axis=0)
  # 0: Off, 1: mark failed simulations and continue, 2: stop all simulations on first failure, 3: retry failed
  # simulations with varying input values by 1e-3% to 1e-7%, 4: run a different configuration file for each failed simulation
  safe_mode_type: 0
  alternative_config_file: None # Path to alternative configuration file
  input_csv: None # Path to input CSV file //not implemented yet
  skip_configuration_check: False # Don't check this configuration file for errors
